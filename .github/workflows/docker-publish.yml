name: Publish Docker Image

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    concurrency: docker-publish
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
        # Add support for more platforms with QEMU (optional)
        # https://github.com/docker/setup-qemu-action
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Update package version
        env:
          VERSION: ${{ inputs.version || 'latest' }}
        run: |
          cd ./docker
          for attempt in 1 2 3 4 5; do
            npm i "shevchenko@$VERSION" --prefer-online --ignore-scripts && break
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 30
          done
      - name: Check in the changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(docker): bump package version"
            git pull --rebase
            git push origin
          fi
      - name: Retrieve the release version
        id: npm-version
        run: echo "current-version=$(node -p "require('./docker/node_modules/shevchenko/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{secrets.DOCKERHUB_USERNAME}}/shevchenko:latest,${{secrets.DOCKERHUB_USERNAME}}/shevchenko:${{steps.npm-version.outputs.current-version}}
