# Runs the tests and stages the package on npm when a GitHub release is created,
# or when run manually from the Actions tab (stages the version in package.json of the selected ref).
# Authenticates with npm trusted publishing (OIDC), so no npm token is stored in the repository.
# The staged version is not public until a maintainer approves it with 2FA:
#   npm stage list shevchenko
#   npm stage approve <stage-id>
# Requires npm CLI with `npm stage` support (bundled with Node.js 24) and a trusted publisher
# for this repository and workflow file with stage publishing allowed:
#   npm trust github shevchenko --repo tooleks/shevchenko-js --file npm-publish.yml --allow-stage-publish
# For more information see: https://docs.npmjs.com/trusted-publishers

name: Publish Node.js Package

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
      - name: Run tests
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Stage package for publishing
        run: |
          npm ci
          npm run build
          npm stage publish
