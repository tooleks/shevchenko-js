name: Publish Node.js Package

on:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Run tests
        run: |
          npm ci
          npm run lint
          npm run build
          npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org/
      - name: Stage package for publishing
        run: |
          npm ci
          npm run build
          npm stage publish

  wait-for-approval:
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Retrieve the package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Wait for the staged package to be approved
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Waiting for shevchenko@$VERSION to be approved on npm"
          deadline=$((SECONDS + 350 * 60))
          until npm view "shevchenko@$VERSION" version --prefer-online > /dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::shevchenko@$VERSION was not approved in time. After approving it, re-run failed jobs."
              exit 1
            fi
            sleep 30
          done
          echo "shevchenko@$VERSION is published"

  publish-docker:
    needs: wait-for-approval
    permissions:
      contents: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.wait-for-approval.outputs.version }}
    secrets: inherit

  generate-site:
    needs: publish-docker
    permissions:
      contents: write
    uses: ./.github/workflows/site-generate.yml
